services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: blinkmeet-frontend

    ports:
      - "5173:5173"

    env_file:
      - ./frontend/.env

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: blinkmeet-backend

    ports:
      - "5001:5001"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 5001
      REDIS_URL: redis://redis:6379
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ap-southeast-1
      DYNAMODB_TABLE_USERS: blinkmeet-local-users
      DYNAMODB_TABLE_EMAILS: blinkmeet-local-emails
      DYNAMODB_TABLE_FRIEND_REQUESTS: blinkmeet-local-friendrequests
      DYNAMODB_TABLE_FRIENDSHIPS: blinkmeet-local-friendships
      DYNAMODB_TABLE_CONVERSATIONS: blinkmeet-local-conversations
      DYNAMODB_TABLE_MESSAGES: blinkmeet-local-messages
      DYNAMODB_TABLE_MESSAGE_KEYS: blinkmeet-local-messagekeys
      # Local defaults are intentionally limited to same-machine development.
      # For cross-network testing configure TURN_PUBLIC_HOST,
      # TURN_EXTERNAL_IP and a non-default TURN_SHARED_SECRET explicitly.
      WEBRTC_STUN_URLS: stun:${TURN_PUBLIC_HOST:-localhost}:3478
      WEBRTC_TURN_URLS: turn:${TURN_PUBLIC_HOST:-localhost}:3478?transport=udp,turn:${TURN_PUBLIC_HOST:-localhost}:3478?transport=tcp
      WEBRTC_ICE_TRANSPORT_POLICY: ${WEBRTC_ICE_TRANSPORT_POLICY:-all}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-blinkmeet-local-turn-secret}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      dynamodb:
        condition: service_started
      redis:
        condition: service_healthy
      coturn:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/create-local-tables.js && node src/server.js"]

  coturn:
    image: coturn/coturn:4.18.0-r0
    container_name: blinkmeet-coturn
    command:
      - -n
      - --log-file=stdout
      - --pidfile=/tmp/turnserver.pid
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-blinkmeet-local-turn-secret}
      - --realm=${TURN_REALM:-blinkmeet.local}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=${TURN_RELAY_MIN_PORT:-55000}
      - --max-port=${TURN_RELAY_MAX_PORT:-55020}
      - --stale-nonce=600
      - --user-quota=4
      - --total-quota=100
      - --no-multicast-peers
      - --prometheus
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "${TURN_RELAY_MIN_PORT:-55000}-${TURN_RELAY_MAX_PORT:-55020}:${TURN_RELAY_MIN_PORT:-55000}-${TURN_RELAY_MAX_PORT:-55020}/udp"
      - "127.0.0.1:9641:9641"
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient 127.0.0.1 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dynamodb_data:
